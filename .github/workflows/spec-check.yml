# spec-check.yml — 规格门禁 CI(契约 M8)
#
# **门禁清单只有一份**:真源 = `scripts/lib/commands.py` 的 `GATE_SCRIPTS`。
#   本文件**不逐个列出门禁名,也不硬编码门禁个数** —— 那会构成第二份清单,必然与真源漂移。
#   全部门禁 + 判据引擎 + 制品自洽性统一由 `scripts/acceptance/run-all-gates.sh` 跑,
#   它消费 `bash scripts/ssdctl.sh gate --json`(JSON 载荷里的 gates[] 就是真源里的那份清单)。
#   门禁的执行顺序(契约 M8 固定)同样由真源给出,本文件不复述。
#   本地与 CI 跑同一条命令 ⇒ 清单不可能在两边漂移,判定与退出码也不可能分叉。
#
# 三条硬规则:
#   1. 门禁**永不全量跳过**: 即使本次 diff 没碰任何制品目录, 也照常跑完(只打 notice)。
#   2. 「本仓没有任何 PRD 制品」= 失败(不允许空洞绿灯)。
#   3. 每个门禁都断言「退出码为 0 且输出非空」—— 防止脚本静默空转被当成绿灯。
#      (run-all-gates.sh 把「exit 0 且 stdout/stderr 全空」标成 WARN;本步骤把该 WARN 升级为错误。)
#
# 关于 sync-prd.sh:
#   台账里存在「待分析 / 待抓取 / 孤儿」行时, sync-prd.sh 的退出码是 1, 那是**工作状态**
#   (material/README.md 的既定语义), 不是规格违规 —— 若直接按退出码判红, 台账一启用 CI 就会常年红。
#   因此本步骤采用「写模式(幂等) + 漂移比对」: 只对「统计块/台账与实际制品不一致」判红。
#   `git status --porcelain` 同时覆盖已跟踪文件的改动**与**新建的未跟踪台账文件
#   (单用 `git diff` 看不到未跟踪文件)。
#   这一步排在门禁之前:门禁看到的必须是**写模式之后**的工作区(与判据引擎看到的状态一致)。

name: spec-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-gates:
    name: 规格门禁
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 关闭 autocrlf(保证工作区行尾与 blob 一致)
        run: git config core.autocrlf false

      - name: 记录本次改动范围(仅通知, 不用于跳过门禁)
        id: scope
        run: |
          set -uo pipefail
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD 2>/dev/null || true)"
          fi
          echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"
          CHANGED=""
          if [ -n "$BASE" ]; then
            CHANGED="$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null || true)"
          fi
          {
            echo "### 本次改动的路径"
            echo '```'
            echo "$CHANGED"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if printf '%s\n' "$CHANGED" | grep -qE '^(prd|tech_design|plan|test_cases|material)/'; then
            echo "::notice::本次 diff 触及制品目录。"
          else
            echo "::notice::本次 diff 未触及任何制品目录(prd/ tech_design/ plan/ test_cases/ material/) — 门禁仍全量执行(契约 M8: 门禁不得跳过)。"
          fi

      - name: PRD 台账登记 + 统计块核对(写模式幂等 + 漂移比对)
        run: |
          set -uo pipefail
          rc=0
          out="$(bash scripts/sync-prd.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          # rc=1 = 台账存在待办行(工作状态, 不是规格违规, 见 material/README.md)
          [ "$rc" -le 1 ] || exit "$rc"
          [ -n "$out" ] || { echo "::error::sync-prd.sh 退出码为 0 但无输出 — 防空转断言失败"; exit 1; }
          drift="$(git status --porcelain -- README.md material/)"
          if [ -n "$drift" ]; then
            echo "::error::统计块/台账与提交态不一致 — 请在本地运行 \`bash scripts/sync-prd.sh\` 并把结果一起提交:"
            printf '%s\n' "$drift"
            exit 1
          fi

      # 契约 §8:真源清单里的全部门禁 + 判据引擎 + 制品自洽性, 一次跑完。
      # 清单不在本文件里写死 —— 真源是 scripts/lib/commands.py 的 GATE_SCRIPTS,
      # 由 run-all-gates.sh 消费 `ssdctl gate --json` 渲染成表(退出码 + 输出字节 + 失败输出)。
      # 命令形态:统一走 `scripts/ssdctl.sh` 包装器 —— 它自己解析解释器
      # (SSDCTL_PYTHON → python3 → python → py -3 → DSH runtime 自带解释器),
      # 每个候选都自检,全不行则 exit 2 并列出候选。
      # CI 也走包装器 ⇒ 包装器持续被验证,不会只在某台机器上可用。
      - name: 门禁(GATE_SCRIPTS 全量 + 判据引擎 + 制品自洽性)
        run: |
          set -uo pipefail
          rc=0
          out="$(bash scripts/acceptance/run-all-gates.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          # 防空转断言(硬规则 3):门禁必须真的跑过,并给出结论。
          [ -n "$out" ] || { echo "::error::run-all-gates.sh 退出码为 0 但无输出 — 防空转断言失败"; exit 1; }
          if ! printf '%s\n' "$out" | grep -q 'RESULT: PASS'; then
            echo "::error::run-all-gates.sh 没有输出 RESULT: PASS — 防空转断言失败"
            exit 1
          fi
          # 某个门禁「exit 0 但 stdout/stderr 全空」= 可能静默空转 → 升级为错误。
          if printf '%s\n' "$out" | grep -q 'WARN: exit 0 with empty stdout'; then
            echo "::error::有门禁退出码为 0 但输出全空 — 防空转断言失败"
            exit 1
          fi

      - name: "断言: 本仓至少存在 1 个 PRD 制品(禁止空洞绿灯)"
        run: |
          set -uo pipefail
          count=0
          for f in prd/*/*.md; do
            [ -f "$f" ] || continue
            case "$f" in */README.md|*/_index.md) continue ;; esac
            count=$((count + 1))
          done
          if [ "$count" -lt 1 ]; then
            echo "::error::本仓没有任何 PRD 制品(prd/{YYYY-MM-DD}/{topic}.md), 门禁无从校验 —— 拒绝空洞绿灯。"
            exit 1
          fi
          echo "✓ PRD 制品数: $count"

      - name: Derived state freshness
        run: |
          set -uo pipefail
          rc=0
          out="$(bash scripts/ssdctl.sh scan --check 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          [ -n "$out" ] || { echo "::error::ssdctl.sh scan --check 退出码为 0 但无输出 — 防空转断言失败"; exit 1; }

      # 判据引擎自身的回归网:每种 kind 至少有一个「能失败」的用例。
      # 没有这一步,有人把引擎改回「永远通过」CI 仍然是绿的 ——
      # 那正是本轮修掉的洞(死代码 + `grep -Eq ""` 恒真)。
      # 解释器同样走包装器,避免 CI 与本地用不同的解析规则。
      - name: 判据引擎单元测试(每种 kind 至少一个能失败用例)
        run: |
          set -uo pipefail
          PY="$(bash scripts/ssdctl.sh --python)"
          rc=0
          out="$("$PY" -m unittest discover -s scripts/tests -t scripts/tests 2>&1)" || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          printf '%s\n' "$out" | grep -Eq 'Ran [1-9][0-9]* tests' || {
            echo "::error::单元测试没有发现任何用例 — 防空转断言失败"
            exit 1
          }
