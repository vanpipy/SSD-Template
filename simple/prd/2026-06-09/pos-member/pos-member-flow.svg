<svg viewBox="0 0 680 1160" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>移动收银APP会员模块完整业务流程图</title>
  <desc>含会员登录(手机号+被扫会员码)、新会员注册、支付即会员、会员解绑</desc>

  <!-- ==================== REGION LABELS ==================== -->
  <rect x="10" y="5" width="152" height="22" rx="4" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="86" y="20" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C" font-family="system-ui, sans-serif">流程1：会员登录</text>

  <rect x="10" y="295" width="152" height="22" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="86" y="310" text-anchor="middle" font-size="11" font-weight="500" fill="#27500A" font-family="system-ui, sans-serif">流程2：会员注册</text>

  <rect x="10" y="560" width="152" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="86" y="575" text-anchor="middle" font-size="11" font-weight="500" fill="#712B13" font-family="system-ui, sans-serif">流程1扩展：会员解绑</text>

  <rect x="10" y="680" width="152" height="22" rx="4" fill="#F4EEFF" stroke="#7733FF" stroke-width="0.5"/>
  <text x="86" y="695" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489" font-family="system-ui, sans-serif">流程3：支付即会员</text>

  <!-- ==================== CONNECTORS ==================== -->

  <!-- 开始 → 收银会话 -->
  <line x1="340" y1="46" x2="340" y2="68" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>

  <!-- 收银会话 → 会员登录页 -->
  <line x1="340" y1="112" x2="340" y2="134" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="355" y="126" font-size="11" fill="#0F6E56" font-family="system-ui, sans-serif">去登录</text>

  <!-- ======= 流程1：会员登录 ======= -->

  <!-- 识别方式分支 -->
  <line x1="340" y1="178" x2="340" y2="200" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>

  <!-- 手机号 -->
  <polyline points="265,232 500,232 500,268" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="400" y="225" font-size="11" fill="#0F6E56" font-family="system-ui, sans-serif">手机号</text>
  <!-- 扫码 -->
  <polyline points="415,232 200,232 200,268" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="280" y="225" font-size="11" fill="#A32D2D" font-family="system-ui, sans-serif">扫码</text>

  <!-- 手机号路径 -->
  <line x1="500" y1="312" x2="500" y2="344" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <line x1="500" y1="388" x2="500" y2="444" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>

  <!-- 扫码路径 -->
  <line x1="200" y1="312" x2="200" y2="344" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <line x1="200" y1="388" x2="200" y2="444" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>

  <!-- 已绑定检查（手机号）→ 已绑定 → 解绑弹窗 -->
  <polyline points="415,476 500,476 500,504" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="460" y="473" font-size="11" fill="#A32D2D" font-family="system-ui, sans-serif">已绑定</text>
  <!-- 已绑定检查（手机号）→ 未绑定 → 查询接口 -->
  <polyline points="415,476 500,476 500,532" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="460" y="500" font-size="11" fill="#0F6E56" font-family="system-ui, sans-serif">未绑定</text>

  <!-- 已绑定检查（扫码）→ 已绑定 → 解绑弹窗 -->
  <polyline points="265,476 200,476 200,504" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="235" y="473" font-size="11" fill="#A32D2D" font-family="system-ui, sans-serif">已绑定</text>
  <!-- 已绑定检查（扫码）→ 未绑定 → 扫码查询 -->
  <polyline points="265,476 200,476 200,532" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="235" y="500" font-size="11" fill="#0F6E56" font-family="system-ui, sans-serif">未绑定</text>

  <!-- 查询接口（手机号）→ 成功/失败 -->
  <line x1="500" y1="576" x2="500" y2="660" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="515" y="620" font-size="11" fill="#0F6E56" font-family="system-ui, sans-serif">存在</text>
  <polyline points="460,610 580,610 580,660" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="548" y="603" font-size="11" fill="#A32D2D" font-family="system-ui, sans-serif">不存在</text>

  <!-- 扫码查询 → 成功/失败 -->
  <line x1="200" y1="576" x2="200" y2="660" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="215" y="620" font-size="11" fill="#0F6E56" font-family="system-ui, sans-serif">成功</text>
  <polyline points="240,610 120,610 120,660" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="160" y="603" font-size="11" fill="#A32D2D" font-family="system-ui, sans-serif">无效</text>

  <!-- 存储会员 → 首页已登录 -->
  <polyline points="500,704 500,740 340,740 340,768" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <polyline points="200,704 200,740 340,740" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>

  <!-- 会员不存在 → 弹窗 → 注册 -->
  <line x1="580" y1="704" x2="580" y2="740" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="595" y="728" font-size="11" fill="#0F6E56" font-family="system-ui, sans-serif">确认注册</text>
  <line x1="580" y1="784" x2="580" y2="816" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>

  <!-- 扫码无效 → Toast -->
  <line x1="120" y1="704" x2="120" y2="728" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>

  <!-- 解绑弹窗 → 确认/取消 -->
  <line x1="340" y1="548" x2="340" y2="584" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>

  <!-- 确认解绑 → 清除+继续查询 -->
  <polyline points="265,618 500,618 500,532" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="400" y="611" font-size="11" fill="#0F6E56" font-family="system-ui, sans-serif">确认解绑→继续</text>
  <!-- 取消解绑 → 回首页 -->
  <polyline points="415,618 340,618 340,768" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="380" y="611" font-size="11" fill="#A32D2D" font-family="system-ui, sans-serif">取消→回首页</text>

  <!-- 首页已登录 → 会员栏状态 / 切换会员 -->
  <line x1="340" y1="812" x2="340" y2="854" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>

  <!-- 切换会员 → 回解绑弹窗 -->
  <polyline points="265,886 100,886 100,520 340,520 340,548" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="160" y="879" font-size="11" fill="#A32D2D" font-family="system-ui, sans-serif">切换会员 → 解绑弹窗</text>

  <!-- 进入收银 → 购物车·结算 -->
  <line x1="340" y1="886" x2="340" y2="920" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>

  <!-- ======= 流程3：支付即会员 ======= -->

  <!-- 购物车·结算 -->
  <line x1="340" y1="964" x2="340" y2="996" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>

  <!-- 已绑定 → 跳过 -->
  <line x1="340" y1="1060" x2="340" y2="1120" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="355" y="1092" font-size="11" fill="#0F6E56" font-family="system-ui, sans-serif">已绑定→直接支付</text>

  <!-- 无会员 → 扫付款码 → 支付即会员 -->
  <polyline points="265,1040 140,1040 140,1068" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>
  <text x="200" y="1033" font-size="11" fill="#A32D2D" font-family="system-ui, sans-serif">无会员</text>

  <line x1="140" y1="1112" x2="140" y2="1136" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#a)"/>

  <!-- ======= 流程2的连接：会员不存在弹窗 → 注册页 ======= -->
  <polyline points="580,816 580,850 580,344 560,344" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="595" y="600" font-size="11" fill="#5F5E5A" font-family="system-ui, sans-serif">跳转注册页</text>

  <!-- ==================== NODES ==================== -->

  <!-- 开始 -->
  <g><rect x="295" y="24" width="90" height="44" rx="22" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/><text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A" font-family="system-ui, sans-serif">开始</text></g>

  <!-- 收银会话 -->
  <g><rect x="265" y="68" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/><text x="340" y="94" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#0C447C" font-family="system-ui, sans-serif">收银会话开始</text></g>

  <!-- 首页会员栏 -->
  <g><rect x="265" y="134" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/><text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#0C447C" font-family="system-ui, sans-serif">首页·点击去登录</text></g>

  <!-- 识别方式 -->
  <g><polygon points="340,200 415,236 340,272 265,236" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text x="340" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#712B13" font-family="system-ui, sans-serif">识别方式?</text></g>

  <!-- 手机号输入 -->
  <g><rect x="460" y="268" width="80" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/><text x="500" y="294" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C" font-family="system-ui, sans-serif">输入手机号</text></g>

  <!-- 扫码 -->
  <g><rect x="160" y="268" width="80" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/><text x="200" y="294" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C" font-family="system-ui, sans-serif">PDA扫码</text></g>

  <!-- 点击登录 -->
  <g><rect x="445" y="344" width="110" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/><text x="500" y="370" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C" font-family="system-ui, sans-serif">点击登录</text></g>

  <!-- 扫码完成 -->
  <g><rect x="145" y="344" width="110" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/><text x="200" y="370" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C" font-family="system-ui, sans-serif">扫码完成</text></g>

  <!-- 已绑定检查（手机号） -->
  <g><polygon points="500,444 540,476 500,508 460,476" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text x="500" y="480" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#712B13" font-family="system-ui, sans-serif">已绑?</text></g>

  <!-- 已绑定检查（扫码） -->
  <g><polygon points="200,444 240,476 200,508 160,476" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text x="200" y="480" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#712B13" font-family="system-ui, sans-serif">已绑?</text></g>

  <!-- 解绑确认弹窗 -->
  <g><rect x="460" y="504" width="80" height="44" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/><text x="500" y="530" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#791F1F" font-family="system-ui, sans-serif">解绑弹窗</text></g>

  <!-- POST login -->
  <g><rect x="445" y="532" width="110" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/><text x="500" y="554" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#0C447C" font-family="system-ui, sans-serif">POST /login</text></g>

  <!-- POST scan-login -->
  <g><rect x="145" y="532" width="110" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/><text x="200" y="554" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#0C447C" font-family="system-ui, sans-serif">POST /scan-login</text></g>

  <!-- 解绑弹窗确认/取消 -->
  <g><polygon points="340,584 380,618 340,652 300,618" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text x="340" y="622" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#712B13" font-family="system-ui, sans-serif">确认?</text></g>

  <!-- 存储会员（手机号） -->
  <g><rect x="460" y="660" width="80" height="44" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/><text x="500" y="686" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#27500A" font-family="system-ui, sans-serif">存储会员</text></g>

  <!-- 存储会员（扫码） -->
  <g><rect x="160" y="660" width="80" height="44" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/><text x="200" y="686" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#27500A" font-family="system-ui, sans-serif">存储会员</text></g>

  <!-- 会员不存在弹窗（手机号） -->
  <g><rect x="540" y="660" width="80" height="44" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/><text x="580" y="686" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#791F1F" font-family="system-ui, sans-serif">弹窗引导注册</text></g>

  <!-- Toast无效（扫码） -->
  <g><rect x="90" y="660" width="60" height="44" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/><text x="120" y="686" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#791F1F" font-family="system-ui, sans-serif">Toast</text></g>

  <!-- 注册页（来自会员不存在弹窗） -->
  <g><rect x="540" y="740" width="80" height="44" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/><text x="580" y="766" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#27500A" font-family="system-ui, sans-serif">注册页</text></g>

  <!-- 首页已登录 -->
  <g><rect x="265" y="768" width="150" height="44" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/><text x="340" y="794" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#27500A" font-family="system-ui, sans-serif">首页·会员已登录</text></g>

  <!-- 会员栏（有会员）→ 进入收银 or 切换 -->
  <g><polygon points="340,854 395,890 340,926 285,890" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text x="340" y="894" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#712B13" font-family="system-ui, sans-serif">下一步?</text></g>

  <!-- 进入收银 -->
  <g><rect x="265" y="920" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/><text x="340" y="946" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#0C447C" font-family="system-ui, sans-serif">进入收银·结算</text></g>

  <!-- 已绑定会员? -->
  <g><polygon points="340,996 415,1032 340,1068 265,1032" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/><text x="340" y="1036" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#712B13" font-family="system-ui, sans-serif">已绑定会员?</text></g>

  <!-- 支付即会员：扫付款码 -->
  <g><rect x="100" y="1068" width="80" height="44" rx="8" fill="#F4EEFF" stroke="#7733FF" stroke-width="0.5"/><text x="140" y="1089" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#3C3489" font-family="system-ui, sans-serif">扫付款码</text></g>

  <!-- 支付即会员：支付中心→渠道→会员中心 -->
  <g><rect x="80" y="1136" width="120" height="44" rx="8" fill="#F4EEFF" stroke="#7733FF" stroke-width="0.5"/><text x="140" y="1157" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#3C3489" font-family="system-ui, sans-serif">支付中心→渠道→</text></g>

  <!-- 支付完成 -->
  <g><rect x="295" y="1120" width="90" height="44" rx="22" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/><text x="340" y="1146" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A" font-family="system-ui, sans-serif">支付完成</text></g>

</svg>
