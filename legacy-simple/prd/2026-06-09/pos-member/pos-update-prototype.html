<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>移动收银APP - 版本更新</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .device-frame {
            width: 375px; height: 700px;
            background: #0f0f1a;
            border-radius: 32px; padding: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative; overflow: hidden;
        }
        .device-frame::before {
            content: ""; position: absolute;
            top: 6px; left: 50%; transform: translateX(-50%);
            width: 80px; height: 20px;
            background: #1a1a2e; border-radius: 0 0 12px 12px; z-index: 10;
        }
        .device-screen {
            width: 100%; height: 100%;
            background: #f5f5f5; border-radius: 24px;
            overflow: hidden; position: relative; display: flex; flex-direction: column;
        }
        .status-bar {
            height: 28px; background: #fff;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; font-size: 12px; color: #1a1a1a; font-weight: 600;
        }
        .status-bar .time { flex:1; text-align:center; }
        .app-header {
            height: 48px; background: #fff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 1px 0 rgba(0,0,0,0.05);
        }
        .app-header h1 { font-size: 17px; font-weight: 600; color: #1a1a1a; }
        .app-content {
            flex:1; position: relative;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay {
            position: absolute; top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 0.3s;
        }

        /* 卡片通用 */
        .update-card {
            width: 300px; background: #fff; border-radius: 16px;
            padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            animation: cardEnter 0.4s ease-out;
        }
        @keyframes cardEnter {
            from { opacity:0; transform:scale(0.9) translateY(20px); }
            to { opacity:1; transform:scale(1) translateY(0); }
        }
        .card-header { text-align:center; margin-bottom:16px; }
        .card-title { font-size:20px; font-weight:700; color:#1a1a1a; margin-bottom:12px; }
        .version-tag {
            display:inline-block; background:#FFF3E6; color:#FF6B00;
            font-size:13px; font-weight:500; padding:4px 12px; border-radius:12px; margin-bottom:6px;
        }
        .current-version { font-size:12px; color:#999; margin-top:4px; }

        /* 更新日志 */
        .update-logs { margin:8px 0; padding:10px; background:#FAFAFA; border-radius:8px; }
        .update-logs h3 { font-size:12px; color:#666; margin-bottom:6px; font-weight:500; }
        .log-list { list-style:none; }
        .log-list li {
            font-size:11px; color:#666; padding:2px 0 2px 14px;
            position:relative; line-height:1.5;
        }
        .log-list li::before { content:"•"; color:#FF6B00; position:absolute; left:2px; font-weight:bold; }

        /* 发现新版本 */
        .new-version-desc {
            text-align: center;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            padding: 12px 0;
        }
        .new-version-desc span {
            display: block;
            margin-bottom: 4px;
        }

        /* 更新图标 */
        .update-icon {
            width: 80px; height: 80px;
            margin: 0 auto 16px;
            animation: rotate 2s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 进度 */
        .progress-section { margin-top:14px; }
        .progress-info { display:flex; justify-content:space-between; margin-bottom:6px; }
        .progress-text { font-size:13px; color:#FF6B00; font-weight:500; }
        .progress-bar-bg { width:100%; height:8px; background:#F0F0F0; border-radius:4px; overflow:hidden; }
        .progress-bar-fill {
            height:100%; background:linear-gradient(90deg,#FF9500,#FF6B00);
            border-radius:4px; transition:width 0.3s; width:0%;
        }
        .progress-status { text-align:center; margin-top:6px; font-size:12px; color:#999; }

        /* 完成 */
        .success-icon {
            width:64px; height:64px; background:linear-gradient(135deg,#52C41A,#389E0D);
            border-radius:50%; display:flex; align-items:center; justify-content:center;
            margin:0 auto 12px; animation:scaleIn 0.5s ease-out;
        }
        @keyframes scaleIn {
            0%{transform:scale(0)} 60%{transform:scale(1.1)} 100%{transform:scale(1)}
        }
        .success-icon svg { width:32px; height:32px; fill:none; stroke:#fff; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
        .complete-header { display:flex; align-items:center; justify-content:center; gap:8px; }
        .countdown { font-size:14px; color:#FF6B00; font-weight:600; min-width:24px; }
        .complete-text { text-align:center; font-size:13px; color:#666; margin-bottom:12px; }
        .redirect-text { text-align:center; font-size:12px; color:#999; margin-top:12px; }

        /* 失败 */
        .error-icon {
            width:64px; height:64px; background:linear-gradient(135deg,#FF6B6B,#D94A4A);
            border-radius:50%; display:flex; align-items:center; justify-content:center;
            margin:0 auto 12px; animation:shakeIn 0.5s ease-out;
        }
        @keyframes shakeIn {
            0%{transform:scale(0)} 40%{transform:scale(1.1)}
            60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
            100%{transform:translateX(0)}
        }
        .error-icon svg { width:32px; height:32px; fill:none; stroke:#fff; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
        .error-code {
            text-align:center; font-size:11px; color:#D94A4A;
            background:#FFF0F0; display:inline-block;
            padding:2px 10px; border-radius:4px; margin:0 auto 12px;
        }
        .error-detail { font-size:12px; color:#666; margin-bottom:8px; }
        .error-contact {
            font-size:12px; color:#999; margin-top:8px; padding:10px;
            background:#FAFAFA; border-radius:8px; line-height:1.6;
        }
        .error-contact strong { color:#FF6B00; font-weight:600; }
        .error-actions { display:flex; gap:8px; margin-top:12px; }
        .error-actions .action-btn { flex:1; margin-top:0; }
        .cancel-btn {
            flex:1; height:44px; padding:0 16px;
            background:transparent; border:1px solid #DDD; border-radius:8px;
            color:#999; font-size:14px; font-weight:500; cursor:pointer; transition:all 0.2s;
        }
        .cancel-btn:hover { background:#F5F5F5; }
        .cancel-btn:active { transform:scale(0.98); }

        .action-btn {
            width:100%; height:44px;
            background:linear-gradient(90deg,#FF9500,#FF6B00);
            border:none; border-radius:8px; color:#fff; font-size:16px; font-weight:600;
            cursor:pointer; margin-top:16px; transition:transform 0.2s,box-shadow 0.2s;
        }
        .action-btn:hover { box-shadow:0 4px 12px rgba(255,107,0,0.35); }
        .action-btn:focus-visible { outline:2px solid #FF6B00; outline-offset:2px; }
        .action-btn:active { transform:scale(0.98); }
        .action-btn:disabled { opacity:0.5; cursor:not-allowed; }

        .hidden { display:none !important; }
        .fade-in { animation:fadeIn 0.4s ease; }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }

        /* 控制面板 */
        .control-panel { margin-top:24px; padding:16px 24px; background:rgba(255,255,255,0.05); border-radius:12px; border:1px solid rgba(255,255,255,0.1); }
        .control-panel h3 { color:#fff; font-size:14px; margin-bottom:12px; opacity:0.8; }
        .controls { display:flex; gap:8px; flex-wrap:wrap; }
        .ctrl-btn {
            padding:8px 16px; background:rgba(255,107,0,0.2); border:1px solid rgba(255,107,0,0.4);
            border-radius:6px; color:#FF9500; font-size:13px; cursor:pointer; transition:all 0.2s;
        }
        .ctrl-btn:hover { background:rgba(255,107,0,0.3); }
        .ctrl-btn:active { transform:scale(0.95); }
        .safe-area { height:20px; background:#fff; }
        .page-desc { color:rgba(255,255,255,0.5); font-size:12px; margin-top:12px; text-align:center; }

        @media (prefers-reduced-motion:reduce) {
            .update-card,.success-icon,.fade-in{animation:none}
            .progress-bar-fill{transition:none}
            .modal-overlay{transition:none}
            .error-icon{animation:none}
        }
    </style>
</head>
<body>
<div class="device-frame">
    <div class="device-screen">
        <div class="status-bar">
            <span>12:30</span>
            <span class="time">移动收银</span>
            <span>📶 🔋</span>
        </div>
        <div class="app-header">
            <h1>系统更新</h1>
        </div>
        <div class="app-content">
            <div class="modal-overlay" id="modalOverlay">

                <!-- 状态1：发现新版本 -->
                <div class="update-card" id="newVersionCard">
                    <div class="card-header">
                        <div class="card-title">发现新版本</div>
                        <div class="version-tag">最新版本：2.0.0（正式版）</div>
                        <div class="current-version">当前版本：1.8.5</div>
                    </div>
                    <div class="new-version-desc">
                        <span>版本更新啦！我们优化了使用体验</span>
                        <span>建议您更新到最新版本</span>
                    </div>
                    <button class="action-btn" id="updateNowBtn">立即更新（3s）</button>
                </div>

                <!-- 状态2：更新中 -->
                <div class="update-card hidden" id="updatingCard">
                    <div class="card-header">
                        <div class="card-title">系统更新中</div>
                        <div class="version-tag">新版本：2.0.0（正式版）</div>
                        <div class="current-version">当前版本：1.8.5</div>
                    </div>
                    <div class="update-icon">
                        <svg viewBox="0 0 100 100" width="80" height="80">
                            <defs>
                                <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#FF9500"/>
                                    <stop offset="100%" stop-color="#FF6B00"/>
                                </linearGradient>
                            </defs>
                            <!-- 齿轮外圈 -->
                            <path d="M50 10 C52.5 10 55 12 55 14.5 L56 22 C60 23 63.5 24.5 67 27 L73 22 C75 21 78 22 79 24 L83 32 C84 34 83 37 81 38.5 L75 42 C76 46 76 50 75.5 54 L81 58 C83 59.5 84 62 83 64 L79 72 C78 74 75 75 73 74 L67 69 C63.5 71.5 60 73 56 74 L55 81.5 C55 84 52.5 86 50 86 C47.5 86 45 84 45 81.5 L44 74 C40 73 36.5 71.5 33 69 L27 74 C25 75 22 74 21 72 L17 64 C16 62 17 59.5 19 58 L25 54 C24.5 50 24.5 46 25 42 L19 38.5 C17 37 16 34 17 32 L21 24 C22 22 25 21 27 22 L33 27 C36.5 24.5 40 23 44 22 L45 14.5 C45 12 47.5 10 50 10Z" fill="url(#gearGrad)"/>
                            <!-- 内圆孔 -->
                            <circle cx="50" cy="48" r="14" fill="#fff"/>
                            <!-- 内圈装饰 -->
                            <circle cx="50" cy="48" r="14" fill="none" stroke="#FF9500" stroke-width="1" opacity="0.3"/>
                            <!-- 中心点 -->
                            <circle cx="50" cy="48" r="4" fill="url(#gearGrad)"/>
                            <!-- 四个弧线装饰 -->
                            <path d="M50 30 Q55 35 50 40 Q45 35 50 30Z" fill="#FF9500" opacity="0.15"/>
                            <path d="M50 56 Q55 61 50 66 Q45 61 50 56Z" fill="#FF9500" opacity="0.15"/>
                            <path d="M34 48 Q39 43 44 48 Q39 53 34 48Z" fill="#FF9500" opacity="0.15"/>
                            <path d="M56 48 Q61 43 66 48 Q61 53 56 48Z" fill="#FF9500" opacity="0.15"/>
                            <!-- 下载箭头 -->
                            <path d="M50 38 L50 56 M42 48 L50 56 L58 48" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="progress-section">
                        <div class="progress-info">
                            <span class="progress-text" id="progressText">已更新/总数（0/12）</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="progressBar"></div>
                        </div>
                        <div class="progress-status" id="progressStatus">正在准备更新中...</div>
                    </div>
                </div>

                <!-- 状态3：更新完成 → 自动跳转登录页 -->
                <div class="update-card hidden" id="completeCard">
                    <div class="card-header complete-header">
                        <div class="card-title">更新完成</div>
                    </div>
                    <div class="success-icon">
                        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <div class="complete-text">已更新至 2.0.0 版本</div>
                    <div class="redirect-text" id="redirectText">系统自动跳转登录页...</div>
                    <div style="text-align:center; margin-top:16px;">
                        <span class="countdown" id="countdown" style="font-size:12px;">3s</span>
                    </div>
                </div>

                <!-- 状态4：更新失败 -->
                <div class="update-card hidden" id="failCard">
                    <div class="card-header">
                        <div class="card-title">更新失败</div>
                    </div>
                    <div class="error-icon">
                        <svg viewBox="0 0 24 24">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </div>
                    <div style="text-align:center;">
                        <span class="error-code" id="errorCode">错误码：E-2003</span>
                    </div>
                    <div class="error-detail" id="errorDetail">
                        更新文件校验失败，安装包可能已损坏。
                    </div>
                    <div class="error-contact">
                        请联系信息支持协助处理！
                    </div>
                    <div class="error-actions">
                        <button class="cancel-btn" id="cancelBtn">取消</button>
                        <button class="action-btn" id="retryBtn" style="flex:1; margin-top:0;">重试更新</button>
                    </div>
                </div>

            </div>
        </div>
        <div class="safe-area"></div>
    </div>
</div>

<div class="control-panel">
    <h3>演示控制面板</h3>
    <div class="controls">
        <button class="ctrl-btn" onclick="resetAll()">⟲ 重置</button>
        <button class="ctrl-btn" onclick="startUpdateProcess()">▶ 正常更新</button>
        <button class="ctrl-btn" onclick="showFail()">✕ 模拟失败</button>
    </div>
</div>
<div class="page-desc">移动收银APP · 版本更新流程 · v2.0</div>

<script>
let updateTimer = null;
let countdownTimer = null;
let autoTimer = null;
let autoSeconds = 3;
let currentProgress = 0;
const totalSteps = 12; // 全量更新，按文件数
const statusMessages = [
    "正在准备更新环境...",
    "正在获取版本中...",
    "正在下载更新文件...",
    "正在校验文件完整性...",
    "正在进行文件更新...",
    "正在加载配置文件...",
    "即将完成..."
];

const newVersionCard = document.getElementById('newVersionCard');
const updatingCard = document.getElementById('updatingCard');
const completeCard = document.getElementById('completeCard');
const failCard = document.getElementById('failCard');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');
const progressStatus = document.getElementById('progressStatus');
const redirectText = document.getElementById('redirectText');
const countdownEl = document.getElementById('countdown');
const errorCode = document.getElementById('errorCode');
const errorDetail = document.getElementById('errorDetail');
const startBtn = document.getElementById('updateNowBtn');
const retryBtn = document.getElementById('retryBtn');
const cancelBtn = document.getElementById('cancelBtn');

function startAutoCountdown() {
    clearInterval(autoTimer);
    autoSeconds = 3;
    startBtn.textContent = '立即更新（' + autoSeconds + 's）';
    autoTimer = setInterval(() => {
        autoSeconds--;
        if (autoSeconds > 0) {
            startBtn.textContent = '立即更新（' + autoSeconds + 's）';
        } else {
            clearInterval(autoTimer);
            startBtn.textContent = '立即更新';
            startUpdateProcess();
        }
    }, 1000);
}

function resetAll() {
    clearInterval(updateTimer);
    clearInterval(countdownTimer);
    clearInterval(autoTimer);
    currentProgress = 0;
    progressBar.style.width = '0%';
    progressText.textContent = '已更新/总数（0/12）';
    progressStatus.textContent = '正在准备更新中...';
    [updatingCard, completeCard, failCard].forEach(el => el.classList.add('hidden'));
    newVersionCard.classList.remove('hidden');
    newVersionCard.classList.remove('fade-in');
    redirectText.textContent = '系统自动跳转登录页...';
    countdownEl.textContent = '3s';
    startAutoCountdown();
}

function hideAllStates() {
    [newVersionCard, updatingCard, completeCard, failCard].forEach(el => el.classList.add('hidden'));
}

function startUpdateProcess() {
    clearInterval(autoTimer);
    startBtn.textContent = '立即更新';
    hideAllStates();
    updatingCard.classList.remove('hidden');
    updatingCard.classList.add('fade-in');
    currentProgress = 0;
    let step = 0;

    updateTimer = setInterval(() => {
        step++;
        currentProgress = Math.round((step / totalSteps) * 100);

        progressBar.style.width = currentProgress + '%';
        progressText.textContent = '已更新/总数（' + step + '/' + totalSteps + '）';

        const statusIndex = Math.min(
            Math.floor((step / totalSteps) * statusMessages.length),
            statusMessages.length - 1
        );
        progressStatus.textContent = statusMessages[statusIndex];

        if (currentProgress >= 100) {
            clearInterval(updateTimer);
            setTimeout(showCompleteAndRedirect, 600);
        }
    }, 80);
}

function showCompleteAndRedirect() {
    clearInterval(countdownTimer);
    hideAllStates();
    completeCard.classList.remove('hidden');
    completeCard.classList.add('fade-in');

    let seconds = 3;
    countdownEl.textContent = seconds + 's';

    countdownTimer = setInterval(() => {
        seconds--;
        if (seconds > 0) {
            countdownEl.textContent = seconds + 's';
        } else {
            clearInterval(countdownTimer);
            countdownEl.textContent = '0s';
            redirectText.textContent = '正在跳转至登录页...';
            setTimeout(() => {
                showToast('已跳转至登录页面');
                resetAll();
            }, 800);
        }
    }, 1000);
}

function showFail() {
    clearInterval(updateTimer);
    clearInterval(countdownTimer);
    hideAllStates();
    failCard.classList.remove('hidden');
    failCard.classList.add('fade-in');
}

retryBtn.addEventListener('click', () => {
    showToast('正在重新尝试更新...');
    setTimeout(() => {
        startUpdateProcess();
    }, 600);
});

cancelBtn.addEventListener('click', () => {
    showToast('已取消更新，请稍后重试');
    resetAll();
});

function showToast(message) {
    const overlay = document.getElementById('modalOverlay');
    const toast = document.createElement('div');
    toast.style.cssText = `
        position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
        background:rgba(0,0,0,0.78); color:#fff; padding:12px 24px; border-radius:8px;
        font-size:14px; z-index:200; pointer-events:none;
        animation: toastAnim 1.8s ease forwards;
    `;
    const style = document.createElement('style');
    style.textContent = `
        @keyframes toastAnim {
            0%{opacity:0;transform:translate(-50%,-50%) scale(0.9)}
            15%{opacity:1;transform:translate(-50%,-50%) scale(1)}
            75%{opacity:1;transform:translate(-50%,-50%) scale(1)}
            100%{opacity:0;transform:translate(-50%,-50%) scale(0.9)}
        }
    `;
    document.head.appendChild(style);
    toast.textContent = message;
    overlay.appendChild(toast);
    setTimeout(() => toast.remove(), 1900);
}

// 点击"开始更新"按钮
startBtn.addEventListener('click', startUpdateProcess);

// 页面加载后显示发现新版本，开始3秒倒计时
window.addEventListener('load', () => {
    startAutoCountdown();
});
</script>
</body>
</html>
